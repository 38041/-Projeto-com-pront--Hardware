<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gerenciador de Hardware" />
  <title>Gerenciador de Hardware</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">Catálogo</span>
      <h1>Gerenciador de Hardware</h1>
      <p>Consulte os aparelhos cadastrados na API.</p>
    </div>
    <span id="statusApi" class="status">Verificando API...</span>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Ferramentas">
      <label for="search">Buscar</label>
      <input id="search" type="search" placeholder="Hardware, marca ou modelo" autocomplete="off" />
      <button id="retryBtn" type="button" class="secondary hidden">Tentar novamente</button>
    </section>

    <p id="message" class="message">Carregando aparelhos...</p>
    <section id="hardwareGrid" class="grid" aria-live="polite"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <img class="card-image" alt="" loading="lazy" />
      <div class="card-body">
        <span class="badge"></span>
        <h2 class="card-title"></h2>
        <p class="card-model"></p>
        <strong class="card-price"></strong>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
